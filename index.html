<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>썸머 써 바이블</title>
<meta property="og:image" content="https://sewoongkim1.github.io/summer-bible/og-image.png">
<link rel="icon" type="image/png" href="https://sewoongkim1.github.io/summer-bible/og-image.png">
<link rel="apple-touch-icon" href="https://sewoongkim1.github.io/summer-bible/og-image.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#f5f6fa;color:#333;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:480px;width:100%;padding:24px 16px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:40px 32px;text-align:center}
h1{font-size:22px;font-weight:700;color:#222;margin-bottom:8px}
.subtitle{font-size:14px;color:#666;margin-bottom:36px}
.btn-wrap{display:flex;flex-direction:column;gap:16px}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .2s;color:#fff}
.btn-primary{background:#3367d6}
.btn-primary:hover{background:#2850a0}
.btn-secondary{background:#5c7cfa}
.btn-secondary:hover{background:#4263d6}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>썸머 써 바이블</h1>
    <p class="subtitle">2026 고척교회 썸머 써 바이블</p>
    <div class="btn-wrap">
      <a class="btn btn-primary" href="https://sewoongkim1.github.io/summer-bible/registration.html">완서자 등록하기</a>
      <a class="btn btn-secondary" href="https://sewoongkim1.github.io/bible-registration/">바이블 등록하기</a>
    </div>
  </div>
</div>
</body>
</html>
