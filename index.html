<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#f5f6fa;color:#333;min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:28px 24px;margin-bottom:20px}
h1{font-size:20px;font-weight:700;color:#222;margin-bottom:6px;text-align:center}
.subtitle{font-size:14px;color:#666;text-align:center;margin-bottom:20px}
.tab-wrap{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;padding:10px;border:2px solid #e0e0e0;border-radius:8px;background:#fff;font-size:14px;font-weight:600;color:#888;cursor:pointer;transition:all .2s}
.tab.active{border-color:#3367d6;color:#3367d6;background:#f0f4ff}
label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:4px;margin-top:14px}
select,input[type=text]{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;color:#333;background:#fafafa;transition:border .2s}
select:focus,input:focus{outline:none;border-color:#3367d6;background:#fff}
.btn{display:block;width:100%;padding:13px;background:#3367d6;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:background .2s}
.btn:hover{background:#2850a0}
.btn.secondary{background:#6c757d}.btn.secondary:hover{background:#545b62}
.btn.outline{background:#fff;color:#3367d6;border:2px solid #3367d6}.btn.outline:hover{background:#f0f4ff}
.hidden{display:none!important}
#errBox{background:#fff0f0;border:1.5px solid #f5c2c7;border-radius:8px;padding:10px 14px;margin-top:12px;color:#c0392b;font-size:13px}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top:3px solid #fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.section-title{font-size:12px;font-weight:700;color:#999;letter-spacing:1px;margin-bottom:12px}
.confirm-box{background:#f8faff;border:2px solid #3367d6;border-radius:12px;padding:20px;margin-bottom:16px}
.confirm-title{font-size:16px;font-weight:700;color:#3367d6;margin-bottom:14px;text-align:center}
.confirm-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e8eef8}
.confirm-row:last-child{border-bottom:none}
.confirm-key{font-size:13px;color:#777;font-weight:600}
.confirm-val{font-size:14px;color:#222;font-weight:700;text-align:right}
.confirm-question{font-size:14px;color:#444;text-align:center;margin:16px 0 4px;font-weight:600}
.result-ok{background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;padding:16px;color:#166534;margin-bottom:12px}
.result-dup{background:#fff7ed;border:1.5px solid #fdba74;border-radius:8px;padding:16px;color:#9a3412;margin-bottom:12px}
.result-found{background:#f0f4ff;border:1.5px solid #93c5fd;border-radius:8px;padding:16px;color:#1e40af;margin-bottom:12px}
.result-notfound{background:#f9fafb;border:1.5px solid #d1d5db;border-radius:8px;padding:16px;color:#6b7280;margin-bottom:12px}
.result-title{font-weight:700;font-size:15px;margin-bottom:8px}
.result-info{font-size:13px;margin-top:4px}
.radio-btn-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.radio-btn-wrap input[type=radio]{display:none}
.radio-btn-wrap label{display:inline-block;padding:8px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;font-weight:600;color:#555;background:#fafafa;cursor:pointer;transition:all .2s;margin:0}
.radio-btn-wrap input[type=radio]:checked+label{border-color:#3367d6;color:#3367d6;background:#f0f4ff}
.radio-btn-wrap label:hover{border-color:#3367d6;color:#3367d6}
.closed-wrap{text-align:center;padding:12px 0}
.closed-icon{font-size:52px;margin-bottom:16px}
.closed-title{font-size:18px;font-weight:700;color:#333;margin-bottom:10px}
.closed-desc{font-size:14px;color:#666;line-height:1.7;margin-bottom:24px}
.closed-period{display:inline-block;background:#f0f4ff;color:#3367d6;border:1.5px solid #c3d4f7;border-radius:8px;padding:8px 20px;font-size:13px;font-weight:700;margin-bottom:24px}
</style>
</head>
<body>
<div class="container"><div class="card">
<h1>썸머 써 바이블 완서자 등록</h1>
<p class="subtitle">2026 고척교회 썸머 써 바이블</p>
<div class="tab-wrap">
<button class="tab active" id="tab-register" onclick="switchMode('register')">등록</button>
<button class="tab" id="tab-lookup" onclick="switchMode('lookup')">조회</button>
</div>
<div id="registerForm">
<div class="section-title">등록 정보 입력</div>
<label>구분</label>
<select id="type" onchange="onTypeChange()"><option value="">선택</option><option value="교구">교구</option><option value="교회학교">교회학교</option></select>
<div id="kyogu-fields" class="hidden">
<label>교구</label>
<div class="radio-btn-wrap">
  <input type="radio" name="district" id="d_1" value="믿음"><label for="d_1">믿음</label>
  <input type="radio" name="district" id="d_2" value="소망"><label for="d_2">소망</label>
  <input type="radio" name="district" id="d_3" value="사랑"><label for="d_3">사랑</label>
  <input type="radio" name="district" id="d_4" value="섬김"><label for="d_4">섬김</label>
  <input type="radio" name="district" id="d_5" value="은혜"><label for="d_5">은혜</label>
  <input type="radio" name="district" id="d_6" value="화평"><label for="d_6">화평</label>
  <input type="radio" name="district" id="d_7" value="기쁨"><label for="d_7">기쁨</label>
  <input type="radio" name="district" id="d_8" value="새가족"><label for="d_8">새가족</label>
</div>
<label>목장(숫자)</label><input type="text" id="cell" placeholder="예: 1 또는 3">
<label>직분 <span style="font-weight:400;color:#aaa;font-size:12px">(선택사항)</span></label>
<div class="radio-btn-wrap">
  <input type="radio" name="position" id="p_1" value="성도님"><label for="p_1">성도님</label>
  <input type="radio" name="position" id="p_2" value="집사님"><label for="p_2">집사님</label>
  <input type="radio" name="position" id="p_3" value="안수집사님"><label for="p_3">안수집사님</label>
  <input type="radio" name="position" id="p_4" value="권사님"><label for="p_4">권사님</label>
  <input type="radio" name="position" id="p_5" value="장로님"><label for="p_5">장로님</label>
  <input type="radio" name="position" id="p_6" value="목사님"><label for="p_6">목사님</label>
  <input type="radio" name="position" id="p_7" value="사모님"><label for="p_7">사모님</label>
</div>
<label>성명</label><input type="text" id="name_k" placeholder="성명을 입력하세요">
</div>
<div id="school-fields" class="hidden">
<label>부서</label>
<div class="radio-btn-wrap">
  <input type="radio" name="department" id="dep_1" value="사랑부"><label for="dep_1">사랑부</label>
  <input type="radio" name="department" id="dep_2" value="영아부"><label for="dep_2">영아부</label>
  <input type="radio" name="department" id="dep_3" value="유아부"><label for="dep_3">유아부</label>
  <input type="radio" name="department" id="dep_4" value="유치부"><label for="dep_4">유치부</label>
  <input type="radio" name="department" id="dep_5" value="유년부"><label for="dep_5">유년부</label>
  <input type="radio" name="department" id="dep_6" value="초등부"><label for="dep_6">초등부</label>
  <input type="radio" name="department" id="dep_7" value="중등부"><label for="dep_7">중등부</label>
  <input type="radio" name="department" id="dep_8" value="고등부"><label for="dep_8">고등부</label>
  <input type="radio" name="department" id="dep_9" value="청년부"><label for="dep_9">청년부</label>
</div>
<label>학년</label><input type="text" id="grade" placeholder="예: 1 또는 3학년">
<label>성명</label><input type="text" id="name_s" placeholder="성명을 입력하세요">
</div>
<div id="errBox" class="hidden"></div>
<button class="btn" onclick="goConfirm()">다음 →</button>
</div>
<div id="confirmForm" class="hidden">
<div class="section-title">입력 정보 확인</div>
<div class="confirm-box"><div class="confirm-title">📋 등록 정보</div><div id="confirmRows"></div></div>
<p class="confirm-question">위 정보로 등록하시겠습니까?</p>
<button class="btn" id="doSubmitBtn" onclick="doSubmit()">✅ 등록하기</button>
<button class="btn outline" onclick="backToRegister()">← 다시 입력</button>
</div>
<div id="doneForm" class="hidden">
<div id="doneResult"></div>
<button class="btn" onclick="clearAndGoRegister()">➕ 새로 등록하기</button>
<button class="btn secondary" onclick="switchMode('lookup');prefillLookup()">🔍 내 등록 조회하기</button>
</div>
<div id="lookupForm" class="hidden">
<div class="section-title">등록 내역 조회</div>
<label>구분</label>
<select id="l_type" onchange="onLookupTypeChange()"><option value="">선택</option><option value="교구">교구</option><option value="교회학교">교회학교</option></select>
<div id="l_kyogu" class="hidden">
<label>교구</label>
<div class="radio-btn-wrap">
  <input type="radio" name="l_district" id="ld_1" value="믿음"><label for="ld_1">믿음</label>
  <input type="radio" name="l_district" id="ld_2" value="소망"><label for="ld_2">소망</label>
  <input type="radio" name="l_district" id="ld_3" value="사랑"><label for="ld_3">사랑</label>
  <input type="radio" name="l_district" id="ld_4" value="섬김"><label for="ld_4">섬김</label>
  <input type="radio" name="l_district" id="ld_5" value="은혜"><label for="ld_5">은혜</label>
  <input type="radio" name="l_district" id="ld_6" value="화평"><label for="ld_6">화평</label>
  <input type="radio" name="l_district" id="ld_7" value="기쁨"><label for="ld_7">기쁨</label>
  <input type="radio" name="l_district" id="ld_8" value="새가족"><label for="ld_8">새가족</label>
</div>
<label>목장(숫자)</label><input type="text" id="l_cell" placeholder="예: 1 또는 3">
<label>성명</label><input type="text" id="l_name_k" placeholder="성명을 입력하세요">
</div>
<div id="l_school" class="hidden">
<label>부서</label>
<div class="radio-btn-wrap">
  <input type="radio" name="l_department" id="ls_1" value="사랑부"><label for="ls_1">사랑부</label>
  <input type="radio" name="l_department" id="ls_2" value="영아부"><label for="ls_2">영아부</label>
  <input type="radio" name="l_department" id="ls_3" value="유아부"><label for="ls_3">유아부</label>
  <input type="radio" name="l_department" id="ls_4" value="유치부"><label for="ls_4">유치부</label>
  <input type="radio" name="l_department" id="ls_5" value="유년부"><label for="ls_5">유년부</label>
  <input type="radio" name="l_department" id="ls_6" value="초등부"><label for="ls_6">초등부</label>
  <input type="radio" name="l_department" id="ls_7" value="중등부"><label for="ls_7">중등부</label>
  <input type="radio" name="l_department" id="ls_8" value="고등부"><label for="ls_8">고등부</label>
  <input type="radio" name="l_department" id="ls_9" value="청년부"><label for="ls_9">청년부</label>
</div>
<label>학년</label><input type="text" id="l_grade" placeholder="예: 1 또는 3학년">
<label>성명</label><input type="text" id="l_name_s" placeholder="성명을 입력하세요">
</div>
<div id="l_errBox" class="hidden" style="background:#fff0f0;border:1.5px solid #f5c2c7;border-radius:8px;padding:10px 14px;margin-top:12px;color:#c0392b;font-size:13px"></div>
<button class="btn" id="lookupBtn" onclick="doLookup()">조회하기</button>
<div id="l_resultBox"></div>
<button class="btn outline hidden" id="backToRegisterBtn" onclick="clearAndGoRegister()">← 등록 화면으로</button>
</div>
</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwPXvTQijKGzN0BkOW79Mr2V96g3jX4n3nojcJbBgbYmUudslXDlUx1c-wa81MKE2zA6w/exec';
const REG_START=new Date('2026-07-01T00:00:00');
const REG_END=new Date('2026-08-31T23:59:59');
function isRegPeriod(){const now=new Date();return now>=REG_START&&now<=REG_END;}
function showClosedScreen(){
  const card=document.querySelector('.card');
  card.innerHTML='<h1>썸머 써 바이블 완서자 등록</h1><p class="subtitle">2026 고척교회 썸머 써 바이블</p>'
    +'<div class="closed-wrap">'
    +'<div class="closed-icon">📅</div>'
    +'<div class="closed-title">등록 기간이 아닙니다</div>'
    +'<div class="closed-desc">완서자 등록은 아래 기간에만 가능합니다.</div>'
    +'<div class="closed-period">2026년 7월 1일 ~ 2026년 8월 31일</div>'
    +'<button class="btn" style="max-width:200px;margin:0 auto" onclick="window.close()">창 닫기</button>'
    +'</div>';
}
let lastParams=null;
function clearRegisterForm(){
  document.getElementById('type').value='';
  document.getElementById('kyogu-fields').classList.add('hidden');
  document.getElementById('school-fields').classList.add('hidden');
  ['cell','name_k','grade','name_s'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});document.querySelectorAll('input[name="district"]').forEach(r=>r.checked=false);
  document.querySelectorAll('input[name="position"]').forEach(r=>r.checked=false);
  document.querySelectorAll('input[name="department"]').forEach(r=>r.checked=false);
  hideErr();
}
function clearAndGoRegister(){
  clearRegisterForm();
  ['registerForm','confirmForm','doneForm','lookupForm'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('registerForm').classList.remove('hidden');
  document.getElementById('tab-register').classList.add('active');
  document.getElementById('tab-lookup').classList.remove('active');
  window.scrollTo(0,0);
}
function switchMode(mode){
  ['registerForm','confirmForm','doneForm','lookupForm'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('tab-register').classList.toggle('active',mode==='register');
  document.getElementById('tab-lookup').classList.toggle('active',mode==='lookup');
  if(mode==='register'){
    if(!isRegPeriod()){showClosedScreen();return;}
clearRegisterForm();
    document.getElementById('registerForm').classList.remove('hidden');
  } else {
    document.getElementById('lookupForm').classList.remove('hidden');
  }
}
function showScreen(id){['registerForm','confirmForm','doneForm'].forEach(i=>document.getElementById(i).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function onTypeChange(){const v=document.getElementById('type').value;document.getElementById('kyogu-fields').classList.toggle('hidden',v!=='교구');document.getElementById('school-fields').classList.toggle('hidden',v!=='교회학교');}
function onLookupTypeChange(){const v=document.getElementById('l_type').value;document.getElementById('l_kyogu').classList.toggle('hidden',v!=='교구');document.getElementById('l_school').classList.toggle('hidden',v!=='교회학교');}
function showErr(msg){const b=document.getElementById('errBox');b.textContent=msg;b.classList.remove('hidden');}
function hideErr(){document.getElementById('errBox').classList.add('hidden');}
function goConfirm(){
  hideErr();
  const type=document.getElementById('type').value;
  if(!type){showErr('구분을 선택해 주세요.');return;}
  let params={type};
  if(type==='교구'){
    const _d=document.querySelector('input[name="district"]:checked');params.district=_d?_d.value:'';
    params.cell=document.getElementById('cell').value.trim();
    const _p=document.querySelector('input[name="position"]:checked');params.position=_p?_p.value:'';
    params.name=document.getElementById('name_k').value.trim();
    if(!params.district){showErr('교구를 선택해 주세요.');return;}
    if(!params.cell){showErr('목장을 입력해 주세요.');return;}
    if(!params.name){showErr('성명을 입력해 주세요.');return;}
  }else{
    const _dep=document.querySelector('input[name="department"]:checked');params.department=_dep?_dep.value:'';
    params.grade=document.getElementById('grade').value.trim();
    params.name=document.getElementById('name_s').value.trim();
    if(!params.department){showErr('부서를 선택해 주세요.');return;}
    if(!params.grade){showErr('학년을 입력해 주세요.');return;}
    if(!params.name){showErr('성명을 입력해 주세요.');return;}
  }
  lastParams=params;
  const rows=[];
  rows.push(['구분',params.type]);
  if(type==='교구'){rows.push(['교구',params.district]);rows.push(['목장',params.cell+'목장']);if(params.position)rows.push(['직분',params.position]);rows.push(['성명',params.name]);}
  else{rows.push(['부서',params.department]);rows.push(['학년',params.grade]);rows.push(['성명',params.name]);}
  document.getElementById('confirmRows').innerHTML=rows.map(([k,v])=>'<div class="confirm-row"><span class="confirm-key">'+k+'</span><span class="confirm-val">'+v+'</span></div>').join('');
  showScreen('confirmForm');window.scrollTo(0,0);
}
function backToRegister(){showScreen('registerForm');window.scrollTo(0,0);}
async function doSubmit(){
  const btn=document.getElementById('doSubmitBtn');
  btn.innerHTML='<span class="spinner"></span>등록 중...';btn.disabled=true;
  try{
    const form=new FormData();
    Object.entries(lastParams).forEach(([k,v])=>form.append(k,v));
    const res=await fetch(API,{method:'POST',body:form});
    const data=await res.json();
    let html='';
    if(data.ok){html=data.isDup?'<div class="result-dup"><div class="result-title">⚠️ 중복 등록 처리됨</div><div class="result-info">'+data.message+'</div></div>':'<div class="result-ok"><div class="result-title">✅ 등록 완료!</div><div class="result-info">'+data.message+'</div></div>';}
    else{html='<div class="result-notfound"><div class="result-title">❌ 등록 실패</div><div class="result-info">'+(data.message||'오류가 발생했습니다.')+'</div></div>';}
    document.getElementById('doneResult').innerHTML=html;
    showScreen('doneForm');window.scrollTo(0,0);
  }catch(e){alert('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');}
  finally{btn.innerHTML='✅ 등록하기';btn.disabled=false;}
}
function prefillLookup(){
  if(!lastParams)return;
  const type=lastParams.type;
  document.getElementById('l_type').value=type;onLookupTypeChange();
  if(type==='교구'){if(lastParams.district){const _el=document.querySelector('input[name="l_district"][value="'+lastParams.district+'"]');if(_el)_el.checked=true;}document.getElementById('l_cell').value=lastParams.cell||'';document.getElementById('l_name_k').value=lastParams.name||'';}
  else{if(lastParams.department){const _el2=document.querySelector('input[name="l_department"][value="'+lastParams.department+'"]');if(_el2)_el2.checked=true;}document.getElementById('l_grade').value=lastParams.grade||'';document.getElementById('l_name_s').value=lastParams.name||'';}
}
async function doLookup(){
  const errBox=document.getElementById('l_errBox');
  errBox.classList.add('hidden');document.getElementById('l_resultBox').innerHTML='';document.getElementById('backToRegisterBtn').classList.add('hidden');
  const type=document.getElementById('l_type').value;
  if(!type){errBox.textContent='구분을 선택해 주세요.';errBox.classList.remove('hidden');return;}
  let qp={action:'lookup',type};
  if(type==='교구'){const _ld=document.querySelector('input[name="l_district"]:checked');qp.group=_ld?_ld.value:'';qp.sub=document.getElementById('l_cell').value.trim();qp.name=document.getElementById('l_name_k').value.trim();}
  else{const _ldep=document.querySelector('input[name="l_department"]:checked');qp.group=_ldep?_ldep.value:'';qp.sub=document.getElementById('l_grade').value.trim();qp.name=document.getElementById('l_name_s').value.trim();}
  const btn=document.getElementById('lookupBtn');
  btn.innerHTML='<span class="spinner"></span>조회 중...';btn.disabled=true;
  try{
    const qs=new URLSearchParams(qp).toString();
    const res=await fetch(API+'?'+qs);
    const data=await res.json();
    const box=document.getElementById('l_resultBox');
    if(!data.ok){errBox.textContent=data.message||'오류가 발생했습니다.';errBox.classList.remove('hidden');return;}
    if(!data.found){box.innerHTML='<div class="result-notfound"><div class="result-title">❌ 미등록</div><div class="result-info">입력하신 정보로 등록된 내역이 없습니다.</div></div>';}
    else{
      const r=data.rows[0];
      const icon=r.status==='중복'?'⚠️':'✅';
      const info=type==='교구'?'구분: '+r.type+' | 교구: '+r.group+' | 목장: '+r.sub+' | 성명: '+r.name:'구분: '+r.type+' | 부서: '+r.group+' | 학년: '+r.sub+' | 성명: '+r.name;
      box.innerHTML='<br><div class="result-found"><div class="result-title">'+icon+' 등록 확인 ('+data.count+'건)</div><div class="result-info">'+info+'</div>'+(r.note?'<div class="result-info" style="margin-top:4px;color:#9a3412">비고: '+r.note+'</div>':'')+'</div>';
    }
    document.getElementById('backToRegisterBtn').classList.remove('hidden');
  }catch(e){errBox.textContent='네트워크 오류가 발생했습니다.';errBox.classList.remove('hidden');}
  finally{btn.innerHTML='조회하기';btn.disabled=false;}
}
if(!isRegPeriod()){showClosedScreen();}
</script>
</body></html>
