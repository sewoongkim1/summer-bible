<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고척교회 썸머 써 바이블</title>
<meta property="og:image" content="https://sewoongkim1.github.io/summer-bible/og-image.png">
<link rel="icon" type="image/png" href="https://sewoongkim1.github.io/summer-bible/og-image.png">
<link rel="apple-touch-icon" href="https://sewoongkim1.github.io/summer-bible/og-image.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#f0f4f8;color:#333;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:0 0 40px}
.page{max-width:420px;width:100%}
.logo-wrap{background:#1a5276;padding:18px 24px;display:flex;align-items:center;justify-content:center;gap:14px}
.logo-wrap img{height:52px;width:auto}
.logo-text{color:#fff;font-size:28px;font-weight:800;letter-spacing:1px}
.body{padding:28px 20px;display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border:2.5px solid #27ae60;border-radius:14px;overflow:hidden;text-decoration:none;display:block;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card-header{background:#1a5276;padding:16px 20px}
.card-title{color:#fff;font-size:20px;font-weight:800;line-height:1.35;word-break:keep-all}
.card-body{padding:14px 20px 18px}
.card-meta{font-size:13.5px;color:#555;line-height:1.9}
.card-meta span{display:block}
.card-meta .label{color:#888;margin-right:2px}
</style>
</head>
<body>
<div class="page">
  <div class="logo-wrap">
    <img src="https://sewoongkim1.github.io/summer-bible/og-image.png" alt="고척교회 로고">
    <span class="logo-text">고척교회</span>
  </div>
  <div class="body">
    <a class="card" href="https://sewoongkim1.github.io/summer-bible/registration.html">
      <div class="card-header">
        <div class="card-title">썸머 써 바이블<br>완서자 등록하기</div>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span><span class="label">기간:</span>2026-05-01 ~ 2026-08-31</span>
          <span><span class="label">대상:</span>전체</span>
        </div>
      </div>
    </a>
    <a class="card" href="https://sewoongkim1.github.io/bible-registration/">
      <div class="card-header">
        <div class="card-title">성경필사 신청하기</div>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span><span class="label">기간:</span>2026-05-01 ~ 2026-08-31</span>
          <span><span class="label">대상:</span>전체</span>
        </div>
      </div>
    </a>
  </div>
</div>
</body>
</html>
