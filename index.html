<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고척교회 썸머 써 바이블</title>
<meta property="og:image" content="https://sewoongkim1.github.io/summer-bible/og-image.png">
<link rel="icon" type="image/png" href="https://sewoongkim1.github.io/summer-bible/og-image.png">
<link rel="apple-touch-icon" href="https://sewoongkim1.github.io/summer-bible/og-image.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#eef2f7;color:#333;min-height:100vh;display:flex;align-items:flex-start;justify-content:center}
.page{max-width:420px;width:100%;background:#eef2f7}

/* 상단 이미지 영역 */
.logo-wrap{width:100%;overflow:hidden;line-height:0}
.logo-wrap img{width:100%;height:auto;display:block}

/* 카드 영역 */
.body{padding:24px 16px;display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border:2.5px solid #27ae60;border-radius:16px;overflow:hidden;text-decoration:none;display:block;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card-header{background:#1a5276;padding:16px 20px 14px}
.card-title{color:#fff;font-size:21px;font-weight:800;line-height:1.4;word-break:keep-all}
.card-body{padding:14px 20px 18px;background:#fff}
.card-meta{font-size:13px;color:#666;line-height:1.7;margin-bottom:14px}
.card-meta .row{display:flex;gap:4px}
.card-meta .label{color:#999;flex-shrink:0}
.card-meta .val{color:#444;font-weight:500}
.card-btn{display:block;width:100%;padding:12px;background:#1a5276;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;transition:background .2s}
.card-btn:hover{background:#154360}
.card-btn.green{background:#27ae60}
.card-btn.green:hover{background:#1e8449}
</style>
</head>
<body>
<div class="page">
  <!-- 상단: 이미지로 채우기 (고척교회 글씨 없음) -->
  <div class="logo-wrap">
    <img src="https://sewoongkim1.github.io/summer-bible/og-image.png" alt="고척교회 썸머 써 바이블">
  </div>

  <div class="body">
    <!-- 카드 1: 썸머 써 바이블 완서자 등록 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">썸머 써 바이블<br>완서자 등록하기</div>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <div class="row"><span class="label">기간:</span><span class="val">2026-05-01 ~ 2026-08-31</span></div>
          <div class="row"><span class="label">대상:</span><span class="val">전체</span></div>
        </div>
        <a class="card-btn" href="https://sewoongkim1.github.io/summer-bible/registration.html">등록하기</a>
      </div>
    </div>

    <!-- 카드 2: 성경필사 신청하기 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">성경필사 신청하기</div>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <div class="row"><span class="label">기간:</span><span class="val">2026-05-01 ~ 2026-08-31</span></div>
          <div class="row"><span class="label">대상:</span><span class="val">전체</span></div>
        </div>
        <a class="card-btn" href="https://sewoongkim1.github.io/bible-registration/">신청하기</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
