<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>고척교회 제자양육부 신앙운동팀</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0d1b3e 0%, #1a3a6b 40%, #0d4a7a 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 60px;
}
.hero { display: flex; flex-direction: column; align-items: center; margin-bottom: 48px; }

/* 로고 박스 - 밝은 배경 */
.logo-wrap {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 20px;
  padding: 16px 28px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 18px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}
.logo-wrap img { width: 60px; height: auto; display: block; flex-shrink: 0; }
.logo-tagline {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.logo-tagline .tagline-main {
  font-size: 17px;
  font-weight: 900;
  color: #0d1b3e;
  letter-spacing: -0.3px;
  line-height: 1.3;
}
.logo-tagline .tagline-sub {
  font-size: 12px;
  font-weight: 500;
  color: #1a5276;
  letter-spacing: 0.5px;
}

.hero-subtitle { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.65); letter-spacing: 3px; }

.cards { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 420px; }
.card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  overflow: hidden;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  cursor: pointer;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
.card-inner { padding: 28px 28px 24px; }
.card-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; margin-bottom: 16px;
}
.card-1 .card-icon { background: linear-gradient(135deg, #f59e0b, #f97316); }
.card-2 .card-icon { background: linear-gradient(135deg, #10b981, #059669); }
.card-title { font-size: 15px; font-weight: 700; color: #ffffff; margin-bottom: 12px; line-height: 1.4; white-space: nowrap; }
.card-meta { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }
.meta-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.6); }
.meta-label { background: rgba(255,255,255,0.12); border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.8); letter-spacing: 0.5px; }
.card-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 0 28px; }
.card-footer { padding: 18px 28px 24px; }
.btn {
  display: block; width: 100%; padding: 14px 0;
  border: none; border-radius: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px; font-weight: 700;
  cursor: pointer; text-decoration: none; text-align: center;
  transition: opacity 0.2s, transform 0.15s; letter-spacing: 0.5px;
}
.btn:hover { opacity: 0.88; transform: scale(0.98); }
.btn-1 { background: linear-gradient(135deg, #f59e0b, #f97316); color: #fff; box-shadow: 0 4px 20px rgba(245,158,11,0.35); }
.btn-2 { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 4px 20px rgba(16,185,129,0.35); }
.footer { margin-top: 48px; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="hero">
  <div class="logo-wrap">
    <img src="logo3.png" alt="고척교회 로고" />
    <div class="logo-tagline">
      <span class="tagline-main">오직성경,</span>
      <span class="tagline-main">말씀이 답이다!</span>
      <span class="tagline-sub">고척교회 제자양육부 신앙운동팀</span>
    </div>
  </div>
  <p class="hero-subtitle">Summer Bible Program 2026</p>
</div>
<div class="cards">
  <div class="card card-1">
    <div class="card-inner">
      <div class="card-icon">📖</div>
      <h2 class="card-title">썸머 써 바이블 완서자 등록하기</h2>
      <div class="card-meta">
        <div class="meta-row"><span class="meta-label">기간</span><span>2026-05-01 ~ 2026-08-31</span></div>
        <div class="meta-row"><span class="meta-label">대상</span><span>전체</span></div>
      </div>
    </div>
    <div class="card-divider"></div>
    <div class="card-footer">
      <a href="https://sewoongkim1.github.io/summer-bible/registration.html" class="btn btn-1">등록하기 →</a>
    </div>
  </div>
  <div class="card card-2">
    <div class="card-inner">
      <div class="card-icon">✍️</div>
      <h2 class="card-title">성경필사 신청하기</h2>
      <div class="card-meta">
        <div class="meta-row"><span class="meta-label">기간</span><span>2026-05-01 ~ 2026-08-31</span></div>
        <div class="meta-row"><span class="meta-label">대상</span><span>전체</span></div>
      </div>
    </div>
    <div class="card-divider"></div>
    <div class="card-footer">
      <a href="https://sewoongkim1.github.io/bible-registration/" class="btn btn-2">신청하기 →</a>
    </div>
  </div>
</div>
<p class="footer">© 2026 고척교회</p>
</body>
</html>
