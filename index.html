<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[고척교회] 썸머 써 바이블 완서자 등록</title>
  <meta name="description" content="고척교회 썸머 써 바이블 완서자 등록/조회 페이지입니다. 접속하여 등록하거나 등록 내역을 조회하세요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="고척교회">
  <meta property="og:title" content="[고척교회] 썸머 써 바이블 완서자 등록">
  <meta property="og:description" content="고척교회 썸머 써 바이블 완서자 등록/조회 페이지입니다. 접속하여 등록하거나 등록 내역을 조회하세요.">
  <meta property="og:image" content="https://sewoongkim1.github.io/summer-bible/og-image.png">
  <meta property="og:image:width" content="1254">
  <meta property="og:image:height" content="1254">
  <meta property="og:url" content="https://sewoongkim1.github.io/summer-bible/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="[고척교회] 썸머 써 바이블 완서자 등록">
  <meta name="twitter:description" content="고척교회 썸머 써 바이블 완서자 등록/조회 페이지입니다.">
  <meta name="twitter:image" content="https://sewoongkim1.github.io/summer-bible/og-image.png">
  <link rel="icon" type="image/png" href="https://sewoongkim1.github.io/summer-bible/og-image.png">
  <link rel="apple-touch-icon" href="https://sewoongkim1.github.io/summer-bible/og-image.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#f5f6fa;color:#333;min-height:100vh}
    .container{max-width:480px;margin:0 auto;padding:24px 16px}
    .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:28px 24px;margin-bottom:20px}
    h1{font-size:20px;font-weight:700;color:#222;margin-bottom:6px;text-align:center}
    .subtitle{font-size:14px;color:#666;text-align:center;margin-bottom:20px}
    .tab-wrap{display:flex;gap:8px;margin-bottom:20px}
    .tab{flex:1;padding:10px;border:2px solid #e0e0e0;border-radius:8px;background:#fff;font-size:14px;font-weight:600;color:#888;cursor:pointer;transition:all .2s}
    .tab.active{border-color:#3367d6;color:#3367d6;background:#f0f4ff}
    label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:4px;margin-top:14px}
    select,input[type=text]{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;color:#333;background:#fafafa;transition:border .2s}
    select:focus,input:focus{outline:none;border-color:#3367d6;background:#fff}
    .btn{display:block;width:100%;padding:13px;background:#3367d6;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:20px;transition:background .2s}
    .btn:hover{background:#2850a0}
    .hidden{display:none!important}
    #errBox{background:#fff0f0;border:1.5px solid #f5c2c7;border-radius:8px;padding:10px 14px;margin-top:12px;color:#c0392b;font-size:13px}
    #resultBox{margin-top:16px}
    .result-ok{background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;padding:16px;color:#166534}
    .result-dup{background:#fff7ed;border:1.5px solid #fdba74;border-radius:8px;padding:16px;color:#9a3412}
    .result-found{background:#f0f4ff;border:1.5px solid #93c5fd;border-radius:8px;padding:16px;color:#1e40af}
    .result-notfound{background:#f9fafb;border:1.5px solid #d1d5db;border-radius:8px;padding:16px;color:#6b7280}
    .result-title{font-weight:700;font-size:15px;margin-bottom:8px}
    .result-info{font-size:13px;margin-top:4px}
    .spinner{display:inline-block;width:18px;height:18px;border:3px solid #fff;border-top:3px solid #3367d6;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .section-title{font-size:12px;font-weight:700;color:#999;letter-spacing:1px;margin-bottom:12px}
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>썸머 써 바이블 완서자 등록</h1>
    <p class="subtitle">2026 고척교회 썸머 써 바이블</p>
    <div class="tab-wrap">
      <button class="tab active" onclick="switchMode('register')">등록</button>
      <button class="tab" onclick="switchMode('lookup')">조회</button>
    </div>
    <div id="registerForm">
      <div class="section-title">등록 정보 입력</div>
      <label for="type">구분</label>
      <select id="type" onchange="onTypeChange()">
        <option value="">선택</option>
        <option value="교구">교구</option>
        <option value="교회학교">교회학교</option>
      </select>
      <div id="kyogu-fields" class="hidden">
        <label for="district">교구</label>
        <select id="district">
          <option value="">선택</option>
          <option>믿음</option><option>소망</option><option>사랑</option>
          <option>섬김</option><option>은혜</option><option>화평</option>
          <option>기쁨</option><option>새가족</option>
        </select>
        <label for="cell">목장</label>
        <input type="text" id="cell" placeholder="예: 1 또는 3목장">
        <label for="position">직분</label>
        <select id="position">
          <option value="">선택 (선택사항)</option>
          <option>장로님</option><option>집사님</option>
          <option>안수집사님 (시무/은퇴)</option>
          <option>권사님 (시무/협에/은퇴)</option>
          <option>장로님 (시무/협에/은퇴)</option>
          <option>목사님 (사모님)</option>
        </select>
        <label for="name_k">성명</label>
        <input type="text" id="name_k" placeholder="성명을 입력하세요">
      </div>
      <div id="school-fields" class="hidden">
        <label for="department">부서</label>
        <select id="department">
          <option value="">선택</option>
          <option>사향부</option><option>영아부</option><option>유아부</option>
          <option>유치부</option><option>유년부</option><option>초등부</option>
          <option>중등부</option><option>고등부</option><option>청년부</option>
        </select>
        <label for="grade">학년</label>
        <input type="text" id="grade" placeholder="예: 1 또는 3학년">
        <label for="name_s">성명</label>
        <input type="text" id="name_s" placeholder="성명을 입력하세요">
      </div>
      <div id="errBox" class="hidden"></div>
      <button class="btn" id="submitBtn" onclick="submitForm()">등록하기</button>
      <div id="resultBox"></div>
    </div>
    <div id="lookupForm" class="hidden">
      <div class="section-title">등록 내역 조회</div>
      <label for="l_type">구분</label>
      <select id="l_type" onchange="onLookupTypeChange()">
        <option value="">선택</option>
        <option value="교구">교구</option>
        <option value="교회학교">교회학교</option>
      </select>
      <div id="l_kyogu" class="hidden">
        <label for="l_district">교구</label>
        <select id="l_district">
          <option value="">선택</option>
          <option>강음</option><option>소망</option><option>사랑</option>
          <option>섬김</option><option>은혜</option><option>화평</option>
          <option>기쁨</option><option>사가족</option>
        </select>
        <label for="l_cell">목장</label>
        <input type="text" id="l_cell" placeholder="예: 1 또는 3목장">
        <label for="l_name_k">성명</label>
        <input type="text" id="l_name_k" placeholder="성명을 입력하세요">
      </div>
      <div id="l_school" class="hidden">
        <label for="l_department">부서</label>
        <select id="l_department">
          <option value="">선택</option>
          <option>사향부</option><option>영아부</option><option>유아부</option>
          <option>유치부</option><option>유년부</option><option>초등부</option>
          <option>중등부</option><option>고등부</option><option>청년부</option>
        </select>
        <label for="l_grade">학년</label>
        <input type="text" id="l_grade" placeholder="예: 1 또는 3학년">
        <label for="l_name_s">성명</label>
        <input type="text" id="l_name_s" placeholder="성명을 입력하세요">
      </div>
      <div id="l_errBox" class="hidden" style="background:#fff0f0;border:1.5px solid #f5c2c7;border-radius:8px;padding:10px 14px;margin-top:12px;color:#c0392b;font-size:13px"></div>
      <button class="btn" id="lookupBtn" onclick="doLookup()">조회하기</button>
      <div id="l_resultBox"></div>
    </div>
  </div>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwPXvTQijKGzN0BkOW79Mr2V96g3jX4n3nojcJbBgbYmUudslXDlUx1c-wa81MKE2zA6w/exec';
function switchMode(mode) {
  document.getElementById('registerForm').classList.toggle('hidden', mode !== 'register');
  document.getElementById('lookupForm').classList.toggle('hidden', mode !== 'lookup');
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0&&mode==='register')||(i===1&&mode==='lookup'));
  });
}
function onTypeChange() {
  const v = document.getElementById('type').value;
  document.getElementById('kyogu-fields').classList.toggle('hidden', v !== '교구');
  document.getElementById('school-fields').classList.toggle('hidden', v !== '교회학교');
}
function onLookupTypeChange() {
  const v = document.getElementById('l_type').value;
  document.getElementById('l_kyogu').classList.toggle('hidden', v !== '교구');
  document.getElementById('l_school').classList.toggle('hidden', v !== '교회학교');
}
function showErr(msg) { const b=document.getElementById('errBox'); b.textContent=msg; b.classList.remove('hidden'); }
function hideErr() { document.getElementById('errBox').classList.add('hidden'); }
async function submitForm() {
  hideErr();
  const type = document.getElementById('type').value;
  if (!type) { showErr('구분을 선택해 주세요.'); return; }
  let params = { type };
  if (type === '교구') {
    params.district = document.getElementById('district').value;
    params.cell     = document.getElementById('cell').value.trim();
    params.position = document.getElementById('position').value;
    params.name     = document.getElementById('name_k').value.trim();
  } else {
    params.department = document.getElementById('department').value;
    params.grade      = document.getElementById('grade').value.trim();
    params.name       = document.getElementById('name_s').value.trim();
  }
  if (!params.name) { showErr('성명을 입력해 주세요.'); return; }
  const btn = document.getElementById('submitBtn');
  btn.innerHTML = '<span class="spinner"></span>등록 중...';
  btn.disabled = true;
  try {
    const form = new FormData();
    Object.entries(params).forEach(([k,v]) => form.append(k,v));
    const res  = await fetch(API, { method:'POST', body: form });
    const data = await res.json();
    const box  = document.getElementById('resultBox');
    if (data.ok) {
      box.innerHTML = data.isDup
        ? '<div class="result-dup"><div class="result-title">⚠️ 중복 등록</div><div class="result-info">'+data.message+'</div></div>'
        : '<div class="result-ok"><div class="result-title">✅ 등록 완료</div><div class="result-info">'+data.message+'</div></div>';
    } else {
      showErr(data.message || '오류가 발생했습니다.');
      box.innerHTML = '';
    }
  } catch(e) { showErr('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.'); }
  finally { btn.innerHTML='등록하기'; btn.disabled=false; }
}
async function doLookup() {
  const errBox = document.getElementById('l_errBox');
  errBox.classList.add('hidden');
  const type = document.getElementById('l_type').value;
  if (!type) { errBox.textContent='구분을 선택해 주세요.'; errBox.classList.remove('hidden'); return; }
  let qp = { action:'lookup', type };
  if (type === '교구') {
    qp.group = document.getElementById('l_district').value;
    qp.sub   = document.getElementById('l_cell').value.trim();
    qp.name  = document.getElementById('l_name_k').value.trim();
  } else {
    qp.group = document.getElementById('l_department').value;
    qp.sub   = document.getElementById('l_grade').value.trim();
    qp.name  = document.getElementById('l_name_s').value.trim();
  }
  const btn = document.getElementById('lookupBtn');
  btn.innerHTML = '<span class="spinner"></span>조회 중...';
  btn.disabled = true;
  try {
    const qs  = new URLSearchParams(qp).toString();
    const res  = await fetch(API + '?' + qs);
    const data = await res.json();
    const box  = document.getElementById('l_resultBox');
    if (!data.ok) { errBox.textContent=data.message||'오류가 발생했습니다.'; errBox.classList.remove('hidden'); box.innerHTML=''; return; }
    if (!data.found) {
      box.innerHTML = '<div class="result-notfound"><div class="result-title">❌ 미등록</div><div class="result-info">입력하신 정보로 등록된 내역이 없습니다.</div></div>';
    } else {
      const r = data.rows[0];
      const statusIcon = r.status==='중복'?'⚠️':'✅';
      const info = type==='교구'
        ? '구분: '+r.type+' | 교구: '+r.group+' | 목장: '+r.sub+' | 성명: '+r.name
        : '구분: '+r.type+' | 부서: '+r.group+' | 학년: '+r.sub+' | 성명: '+r.name;
      box.innerHTML = '<div class="result-found"><div class="result-title">'+statusIcon+' 등록 확인 ('+data.count+'건)</div><div class="result-info">'+info+'</div>'+(r.note?'<div class="result-info" style="margin-top:4px;color:#9a3412">비고: '+r.note+'</div>':'')+'</div>';
    }
  } catch(e) { errBox.textContent='네트워크 오류가 발생했습니다.'; errBox.classList.remove('hidden'); }
  finally { btn.innerHTML='조회하기'; btn.disabled=false; }
}
</script>
</body>
</html>
