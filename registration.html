<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
min-height:100vh;
background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 40%,#0d4a7a 100%);
color:#333;
padding:12px 16px 60px;
}
/* ── 헤더 로고 (index.html 동일) ── */
.page-header{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;}
.logo-wrap{
background:rgba(255,255,255,0.92);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.6);
border-radius:20px;
padding:16px 28px;
margin-bottom:10px;
display:flex;
align-items:center;
gap:18px;
box-shadow:0 4px 24px rgba(0,0,0,0.18);
}
.logo-wrap img{width:50px;height:auto;display:block;flex-shrink:0;}
.logo-tagline{display:flex;flex-direction:column;gap:2px;}
.logo-tagline .tagline-main { font-size: 16px; font-weight: 800; color: #0d1b3e; letter-spacing: -0.3px; line-height: 1.3; }
.logo-tagline .tagline-sub{font-size:12px;font-weight:500;color:#1a5276;letter-spacing:0.5px;}
.page-subtitle{font-size:13px;font-weight:500;color:rgba(255,255,255,0.65);letter-spacing:3px;}
/* ── 메인 카드 ── */
.container{max-width:480px;margin:0 auto;}
.card{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,0.15);
border-radius:24px;
padding:28px 24px;
margin-bottom:20px;
color:#fff;
}
/* ── 폼 타이틀 ── */
h1{font-size:19px;font-weight:700;color:#fff;margin-bottom:4px;text-align:center;}
.subtitle{font-size:13px;color:rgba(255,255,255,0.6);text-align:center;margin-bottom:20px;}
/* ── 탭 ── */
.tab-wrap{display:flex;gap:8px;margin-bottom:20px;}
.tab{flex:1;padding:10px;border:1.5px solid rgba(255,255,255,0.2);border-radius:10px;background:rgba(255,255,255,0.06);font-size:14px;font-weight:600;color:rgba(255,255,255,0.55);cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.tab.active{border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,0.12);}
/* ── 레이블 ── */
label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,0.75);margin-bottom:4px;margin-top:14px;}
.section-title{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);letter-spacing:1.5px;margin-bottom:12px;text-transform:uppercase;}
/* ── 입력 필드 ── */
select,input[type=text]{
width:100%;padding:10px 12px;
border:1.5px solid rgba(255,255,255,0.2);
border-radius:10px;
font-size:14px;color:#fff;
background:rgba(255,255,255,0.08);
transition:border .2s;
font-family:'Noto Sans KR',sans-serif;
}
select:focus,input:focus{outline:none;border-color:#f59e0b;background:rgba(255,255,255,0.12);}
select option{color:#333;background:#fff;}
input::placeholder{color:rgba(255,255,255,0.35);}
/* ── 라디오 버튼 ── */
.radio-btn-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.radio-btn-wrap input[type=radio]{display:none;}
.radio-btn-wrap label{
display:inline-block;padding:7px 13px;
border:1.5px solid rgba(255,255,255,0.2);
border-radius:8px;font-size:13px;font-weight:600;
color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.06);
cursor:pointer;transition:all .2s;margin:0;
}
.radio-btn-wrap input[type=radio]:checked+label{border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,0.12);}
.radio-btn-wrap label:hover{border-color:rgba(255,255,255,0.5);color:#fff;}
/* ── 버튼 ── */
.btn{
display:block;width:100%;padding:13px;
background:linear-gradient(135deg,#f59e0b,#f97316);
color:#fff;border:none;border-radius:12px;
font-size:15px;font-weight:700;cursor:pointer;
margin-top:12px;transition:opacity .2s,transform .15s;
letter-spacing:0.3px;font-family:'Noto Sans KR',sans-serif;
box-shadow:0 4px 16px rgba(245,158,11,0.3);
}
.btn:hover{opacity:0.88;transform:scale(0.98);}
.btn.secondary{background:linear-gradient(135deg,#6c757d,#495057);box-shadow:0 4px 16px rgba(0,0,0,0.2);}
.btn.outline{background:transparent;color:rgba(255,255,255,0.8);border:1.5px solid rgba(255,255,255,0.3);box-shadow:none;}
.btn.outline:hover{background:rgba(255,255,255,0.08);color:#fff;}
/* ── 에러박스 ── */
.hidden{display:none!important;}
#errBox{background:rgba(192,57,43,0.15);border:1.5px solid rgba(192,57,43,0.5);border-radius:10px;padding:10px 14px;margin-top:12px;color:#ff8a80;font-size:13px;}
/* ── 스피너 ── */
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top:3px solid #fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── 확인 박스 ── */
.confirm-box{background:rgba(255,255,255,0.06);border:1.5px solid rgba(245,158,11,0.5);border-radius:14px;padding:20px;margin-bottom:16px;}
.confirm-title{font-size:15px;font-weight:700;color:#f59e0b;margin-bottom:14px;text-align:center;}
.confirm-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
.confirm-row:last-child{border-bottom:none;}
.confirm-key{font-size:13px;color:rgba(255,255,255,0.5);font-weight:600;}
.confirm-val{font-size:14px;color:#fff;font-weight:700;text-align:right;}
.confirm-question{font-size:14px;color:rgba(255,255,255,0.7);text-align:center;margin:16px 0 4px;font-weight:600;}
/* ── 결과 박스 ── */
.result-ok{background:rgba(16,185,129,0.12);border:1.5px solid rgba(16,185,129,0.5);border-radius:10px;padding:16px;color:#6ee7b7;margin-bottom:12px;}
.result-dup{background:rgba(251,146,60,0.12);border:1.5px solid rgba(251,146,60,0.5);border-radius:10px;padding:16px;color:#fdba74;margin-bottom:12px;}
.result-found{background:rgba(96,165,250,0.1);border:1.5px solid rgba(96,165,250,0.4);border-radius:10px;padding:16px;color:#93c5fd;margin-bottom:12px;}
.result-notfound{background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:16px;color:rgba(255,255,255,0.5);margin-bottom:12px;}
.result-title{font-weight:700;font-size:15px;margin-bottom:8px;}
.result-info{font-size:13px;margin-top:4px;}
/* ── 닫힘 화면 ── */
.closed-wrap{text-align:center;padding:12px 0;}
.closed-icon{font-size:52px;margin-bottom:16px;}
.closed-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:10px;}
.closed-desc{font-size:14px;color:rgba(255,255,255,0.6);line-height:1.7;margin-bottom:24px;}
.closed-period{display:inline-block;background:rgba(245,158,11,0.12);color:#f59e0b;border:1.5px solid rgba(245,158,11,0.4);border-radius:8px;padding:8px 20px;font-size:13px;font-weight:700;margin-bottom:24px;}
/* ── 조회 에러박스 ── */
#l_errBox{background:rgba(192,57,43,0.15);border:1.5px solid rgba(192,57,43,0.5);border-radius:10px;padding:10px 14px;margin-top:12px;color:#ff8a80;font-size:13px;}
</style>
</head>

<script>
const API='https://script.google.com/macros/s/AKfycbwPXvTQijKGzN0BkOW79Mr2V96g3jX4n3nojcJbBgbYmUudslXDlUx1c-wa81MKE2zA6w/exec';
const REG_START=new Date('2026-05-01T00:00:00');
const REG_END=new Date('2026-08-31T23:59:59');
function isRegPeriod(){const now=new Date();return now>=REG_START&&now<=REG_END;}
function showClosedScreen(){
const card=document.querySelector('.card');
card.innerHTML='<h1>썸머 써 바이블 완서자 등록</h1><p class="subtitle">2026 고척교회 썸머 써 바이블</p>'
+'<div class="closed-wrap">'
+'<div class="closed-icon">📅</div>'
+'<div class="closed-title">등록 기간이 아닙니다</div>'
+'<div class="closed-desc">완서자 등록은 아래 기간에만 가능합니다.</div>'
+'<div class="closed-period">2026년 7월 1일 ~ 2026년 8월 31일</div>'
+'<button class="btn" style="max-width:200px;margin:0 auto" onclick="window.close()">창 닫기</button>'
+'</div>';
}
let lastParams=null;
function clearRegisterForm(){
document.querySelectorAll('input[name="type"]').forEach(r=>r.checked=false);
document.getElementById('kyogu-fields').classList.add('hidden');
document.getElementById('school-fields').classList.add('hidden');
['cell','name_k','grade','name_s'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
document.querySelectorAll('input[name="district"]').forEach(r=>r.checked=false);
document.querySelectorAll('input[name="position"]').forEach(r=>r.checked=false);
document.querySelectorAll('input[name="department"]').forEach(r=>r.checked=false);
hideErr();
}
function clearAndGoRegister(){
clearRegisterForm();
['registerForm','confirmForm','doneForm','lookupForm'].forEach(id=>document.getElementById(id).classList.add('hidden'));
document.getElementById('registerForm').classList.remove('hidden');
document.getElementById('tab-register').classList.add('active');
document.getElementById('tab-lookup').classList.remove('active');
window.scrollTo(0,0);
}
function switchMode(mode){
['registerForm','confirmForm','doneForm','lookupForm'].forEach(id=>document.getElementById(id).classList.add('hidden'));
document.getElementById('tab-register').classList.toggle('active',mode==='register');
document.getElementById('tab-lookup').classList.toggle('active',mode==='lookup');
if(mode==='register'){
if(!isRegPeriod()){showClosedScreen();return;}
clearRegisterForm();
document.getElementById('registerForm').classList.remove('hidden');
}else{
document.getElementById('lookupForm').classList.remove('hidden');
}
}
function showScreen(id){['registerForm','confirmForm','doneForm'].forEach(i=>document.getElementById(i).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function onTypeChange(){const v=(document.querySelector('input[name="type"]:checked')||{}).value||'';document.getElementById('kyogu-fields').classList.toggle('hidden',v!=='교구');document.getElementById('school-fields').classList.toggle('hidden',v!=='교회학교');}
function onLookupTypeChange(){const v=(document.querySelector('input[name="l_type"]:checked')||{}).value||'';document.getElementById('l_kyogu').classList.toggle('hidden',v!=='교구');document.getElementById('l_school').classList.toggle('hidden',v!=='교회학교');}
function showErr(msg){const b=document.getElementById('errBox');b.textContent=msg;b.classList.remove('hidden');}
function hideErr(){document.getElementById('errBox').classList.add('hidden');}
function goConfirm(){
hideErr();
const type=(document.querySelector('input[name="type"]:checked')||{}).value||'';
if(!type){showErr('구분을 선택해 주세요.');return;}
let params={type};
if(type==='교구'){
const _d=document.querySelector('input[name="district"]:checked');params.district=_d?_d.value:'';
params.cell=document.getElementById('cell').value.trim();
const _p=document.querySelector('input[name="position"]:checked');params.position=_p?_p.value:'';
params.name=document.getElementById('name_k').value.trim();
if(!params.district){showErr('교구를 선택해 주세요.');return;}
if(!params.cell){showErr('목장을 입력해 주세요.');return;}
if(!params.name){showErr('성명을 입력해 주세요.');return;}
}else{
const _dep=document.querySelector('input[name="department"]:checked');params.department=_dep?_dep.value:'';
params.grade=document.getElementById('grade').value.trim();
params.name=document.getElementById('name_s').value.trim();
if(!params.department){showErr('부서를 선택해 주세요.');return;}
if(!params.grade){showErr('학년을 입력해 주세요.');return;}
if(!params.name){showErr('성명을 입력해 주세요.');return;}
}
lastParams=params;
const rows=[];
rows.push(['구분',params.type]);
if(type==='교구'){rows.push(['교구',params.district]);rows.push(['목장',params.cell+'목장']);if(params.position)rows.push(['직분',params.position]);rows.push(['성명',params.name]);}
else{rows.push(['부서',params.department]);rows.push(['학년',params.grade]);rows.push(['성명',params.name]);}
document.getElementById('confirmRows').innerHTML=rows.map(([k,v])=>'<div class="confirm-row"><span class="confirm-key">'+k+'</span><span class="confirm-val">'+v+'</span></div>').join('');
showScreen('confirmForm');window.scrollTo(0,0);
}
function backToRegister(){showScreen('registerForm');window.scrollTo(0,0);}
async function doSubmit(){
const btn=document.getElementById('doSubmitBtn');
btn.innerHTML='<span class="spinner"></span>등록 중...';btn.disabled=true;
try{
const form=new FormData();
Object.entries(lastParams).forEach(([k,v])=>form.append(k,v));
const res=await fetch(API,{method:'POST',body:form});
const data=await res.json();
let html='';
if(data.ok){html=data.isDup?'<div class="result-dup"><div class="result-title">⚠️ 등록 내역이 있음</div><div class="result-info">이미 등록된 내역이 있습니다.</div></div>':'<div class="result-ok"><div class="result-title">✅ 등록 완료!</div><div class="result-info">'+data.message+'</div></div>';}
else{html='<div class="result-notfound"><div class="result-title">❌ 등록 실패</div><div class="result-info">'+(data.message||'오류가 발생했습니다.')+'</div></div>';}
document.getElementById('doneResult').innerHTML=html;
showScreen('doneForm');window.scrollTo(0,0);
}catch(e){alert('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');}
finally{btn.innerHTML='✅ 등록하기';btn.disabled=false;}
}
function prefillLookup(){
if(!lastParams)return;
const type=lastParams.type;
const _lt=document.querySelector('input[name="l_type"][value="'+type+'"]');if(_lt){_lt.checked=true;}onLookupTypeChange();
if(type==='교구'){if(lastParams.district){const _el=document.querySelector('input[name="l_district"][value="'+lastParams.district+'"]');if(_el)_el.checked=true;}document.getElementById('l_cell').value=lastParams.cell||'';document.getElementById('l_name_k').value=lastParams.name||'';}
else{if(lastParams.department){const _el2=document.querySelector('input[name="l_department"][value="'+lastParams.department+'"]');if(_el2)_el2.checked=true;}document.getElementById('l_grade').value=lastParams.grade||'';document.getElementById('l_name_s').value=lastParams.name||'';}
}
async function doLookup(){
const errBox=document.getElementById('l_errBox');
errBox.classList.add('hidden');document.getElementById('l_resultBox').innerHTML='';document.getElementById('backToRegisterBtn').classList.add('hidden');
const type=(document.querySelector('input[name="l_type"]:checked')||{}).value||'';
if(!type){errBox.textContent='구분을 선택해 주세요.';errBox.classList.remove('hidden');return;}
let qp={action:'lookup',type};
if(type==='교구'){const _ld=document.querySelector('input[name="l_district"]:checked');qp.group=_ld?_ld.value:'';qp.sub=document.getElementById('l_cell').value.trim();qp.name=document.getElementById('l_name_k').value.trim();}
else{const _ldep=document.querySelector('input[name="l_department"]:checked');qp.group=_ldep?_ldep.value:'';qp.sub=document.getElementById('l_grade').value.trim();qp.name=document.getElementById('l_name_s').value.trim();}
const btn=document.getElementById('lookupBtn');
btn.innerHTML='<span class="spinner"></span>조회 중...';btn.disabled=true;
try{
const qs=new URLSearchParams(qp).toString();
const res=await fetch(API+'?'+qs);
const data=await res.json();
const box=document.getElementById('l_resultBox');
if(!data.ok){errBox.textContent=data.message||'오류가 발생했습니다.';errBox.classList.remove('hidden');return;}
if(!data.found){box.innerHTML='<div class="result-notfound"><div class="result-title">❌ 미등록</div><div class="result-info">입력하신 정보로 등록된 내역이 없습니다.</div></div>';}
else{
const r=data.rows[0];
const icon=r.status==='중복'?'⚠️':'✅';
const info=type==='교구'?'구분: '+r.type+' | 교구: '+r.group+' | 목장: '+r.sub+' | 성명: '+r.name:'구분: '+r.type+' | 부서: '+r.group+' | 학년: '+r.sub+' | 성명: '+r.name;
box.innerHTML='<br><div class="result-found"><div class="result-title">'+icon+' 등록 확인 ('+data.count+'건)</div><div class="result-info">'+info+'</div>'+(r.note?'<div class="result-info" style="margin-top:4px;color:#fbbf24">비고: '+r.note+'</div>':'')+'</div>';
}
document.getElementById('backToRegisterBtn').classList.remove('hidden');
}catch(e){errBox.textContent='네트워크 오류가 발생했습니다.';errBox.classList.remove('hidden');}
finally{btn.innerHTML='조회하기';btn.disabled=false;}
}
if(!isRegPeriod()){showClosedScreen();}
</script>
</body></html>
